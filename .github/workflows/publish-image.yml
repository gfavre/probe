name: Test and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test release image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: uptime
          POSTGRES_USER: uptime
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U uptime -d uptime"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate version and tag
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$REF" == refs/tags/* && "$REF_NAME" != "v$version" ]]; then
            echo 'The release tag must match VERSION.' >&2
            exit 1
          fi
      - name: Validate both Compose configurations
        env:
          ENV_FILE: .env.example
        run: |
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file .env.example -f compose.registry.yaml config --quiet
      - name: Build test image
        run: >-
          docker build --build-arg APP_VERSION="$(cat VERSION)"
          --build-arg VCS_REF="$GITHUB_SHA" -t probe-ci .
      - name: Run PostgreSQL tests in the application image
        run: >-
          docker run --rm --network host
          -e DJANGO_SECRET_KEY=ci-only-not-a-production-secret
          -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_HOST=127.0.0.1
          -e HTTPS=false -e SENTRY_DSN= -e PUBLIC_URL=http://127.0.0.1:8000
          probe-ci python manage.py test monitor --noinput

  publish:
    name: Publish versioned multi-platform image
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read image version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gfavre/probe:${{ steps.version.outputs.version }}
            ghcr.io/gfavre/probe:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
          sbom: true
      - name: Write image summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Image: `ghcr.io/gfavre/probe:%s`\n\nDigest: `%s`\n\nPlatforms: `linux/amd64`, `linux/arm64`\n' "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
