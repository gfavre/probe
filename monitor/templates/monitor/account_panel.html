{% load i18n %}<div class="sidebar-bottom account-panel"><a class="account-identity" href="{% url 'profile' %}" aria-label="{% translate 'Modifier le profil' %}"><span class="account-avatar" aria-hidden="true">{{ request.user.get_username|first|upper }}</span><div class="account-copy"><strong>{{ request.user.get_full_name|default:request.user.get_username }}</strong><span class="account-email">{{ request.user.email }}</span></div><svg class="account-edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L5 15l-1 5Z"/></svg></a><form class="language-switch" action="{% url 'set_profile_language' %}" method="post" aria-label="{% translate 'Langue de l’interface' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" name="language" value="fr" lang="fr" aria-label="Français" aria-pressed="{% if request.LANGUAGE_CODE == 'fr' %}true{% else %}false{% endif %}">FR</button><button type="submit" name="language" value="en" lang="en" aria-label="English" aria-pressed="{% if request.LANGUAGE_CODE == 'en' %}true{% else %}false{% endif %}">EN</button></form><form class="logout-form" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="logout"><svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4M14 8l4 4-4 4M8 12h13"/></svg><span>{% translate 'Se déconnecter' %}</span></button></form></div>
