{% load i18n monitor_i18n %}{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination"><span>{% translate "Page" %} {{ page.number }} {% translate "sur" %} {{ page.paginator.num_pages }}</span><div class="actions">{% if page.has_previous %}<a class="button small" href="?page={{ page.previous_page_number }}{% if selected_status %}&amp;status={{ selected_status|urlencode }}{% endif %}">{% translate "Précédente" %}</a>{% endif %}{% if page.has_next %}<a class="button small" href="?page={{ page.next_page_number }}{% if selected_status %}&amp;status={{ selected_status|urlencode }}{% endif %}">{% translate "Suivante" %}</a>{% endif %}</div></nav>{% endif %}
