<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="240" viewBox="0 0 1600 240" role="img" aria-label="Beyond the Probe">
  <title>Beyond the Probe — logo transparent</title>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28E7FF"/>
      <stop offset="47%" stop-color="#338BFF"/>
      <stop offset="100%" stop-color="#BD35FF"/>
    </linearGradient>
    <filter id="aura" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="pulseGlow" x="-50%" y="-90%" width="200%" height="280%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <!-- Transparent canvas: only the logomark and lettering are painted. -->
  <g transform="translate(28 20)">
    <rect x="8" y="8" width="184" height="184" rx="40" fill="none" stroke="url(#neon)" stroke-width="10" opacity=".8" filter="url(#aura)"/>
    <rect x="8" y="8" width="184" height="184" rx="40" fill="none" stroke="url(#neon)" stroke-width="5"/>
    <path d="M35 105 H71 L84 85 L99 123 L124 49 L145 151 L163 91 L176 105 H169" fill="none" stroke="#00DFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".75" filter="url(#pulseGlow)"/>
    <path d="M35 105 H71 L84 85 L99 123 L124 49 L145 151 L163 91 L176 105 H169" fill="none" stroke="#A5F7FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="270" y="145" fill="#FFFFFF" font-family="Michroma, 'Eurostile', 'Inter Display', sans-serif" font-size="67" font-weight="400" letter-spacing=".6">Beyond the Probe</text>
</svg>
